# Primary CI (GitLab). Release/publishing to the Terraform Registry runs on the
# GitHub mirror via .github/workflows/release.yml — see README "Hosting & Releasing".
stages:
  - test

test:
  stage: test
  image: golang:1.25
  script:
    - go build ./...
    - go vet ./...
    # Check only project sources — GOMODCACHE lives inside the project dir
    # for caching and must not be scanned.
    - unformatted=$(gofmt -l main.go internal); if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
    - go test ./... -v
  cache:
    key: go-mod
    paths:
      - .go-mod-cache/
  variables:
    GOMODCACHE: $CI_PROJECT_DIR/.go-mod-cache
