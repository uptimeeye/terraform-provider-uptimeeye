components:
  schemas:
    AddStatusPageDomainRequestBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://api.uptimeeye.com/schemas/AddStatusPageDomainRequestBody.json
          format: uri
          readOnly: true
          type: string
        hostname:
          example: status.acme.com
          type: string
      required:
        - hostname
      type: object
    AddStatusPageDomainResponseBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://api.uptimeeye.com/schemas/AddStatusPageDomainResponseBody.json
          format: uri
          readOnly: true
          type: string
        cnameTarget:
          type: string
        domain:
          $ref: "#/components/schemas/StatusPageDomain"
      required:
        - domain
        - cnameTarget
      type: object
    ApiKey:
      additionalProperties: false
      properties:
        createdAt:
          format: date-time
          type: string
        createdBy:
          example: user_2abc
          type: string
        id:
          example: apik_tXlzMyixOqgBXtD8Myc8R
          type: string
        keyPrefix:
          example: ue_live_a1b2
          type: string
        lastUsedAt:
          format: date-time
          type: string
        name:
          example: Claude MCP
          type: string
      required:
        - id
        - name
        - keyPrefix
        - createdBy
        - createdAt
      type: object
    ApiKeyCreated:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://api.uptimeeye.com/schemas/ApiKeyCreated.json
          format: uri
          readOnly: true
          type: string
        id:
          example: apik_tXlzMyixOqgBXtD8Myc8R
          type: string
        key:
          example: ue_live_a1b2c3...
          type: string
        keyPrefix:
          example: ue_live_a1b2
          type: string
        name:
          example: Claude MCP
          type: string
      required:
        - id
        - name
        - keyPrefix
        - key
      type: object
    Assert:
      additionalProperties: false
      properties:
        expected:
          example: "200"
          type: string
        operator:
          enum:
            - contains
            - doesNotContain
            - is
            - isNot
            - lessThan
            - lessThanOrEqual
            - moreThan
            - moreThanOrEqual
          example: is
          type: string
        property:
          example: statusCode
          type: string
        type:
          enum:
            - body
            - bodyJsonPath
            - header
            - statusCode
            - dnsRecord
            - responseTime
            - sslCertificate
          example: statusCode
          type: string
      required:
        - type
        - operator
        - expected
      type: object
    AssertResult:
      additionalProperties: false
      properties:
        actual:
          type: string
        expected:
          type: string
        operator:
          type: string
        property:
          type: string
        success:
          type: boolean
        type:
          enum:
            - body
            - bodyJsonPath
            - header
            - statusCode
            - dnsRecord
            - responseTime
            - sslCertificate
          type: string
      required:
        - success
        - type
        - operator
        - property
        - expected
        - actual
      type: object
    ChannelPost:
      additionalProperties: true
      properties:
        chat:
          $ref: "#/components/schemas/Chat"
        text:
          type: string
      required:
        - chat
        - text
      type: object
    Chat:
      additionalProperties: true
      properties:
