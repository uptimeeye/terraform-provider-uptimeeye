          example: https://api.uptimeeye.com/schemas/UpdateIncidentUpdateRequestBody.json
          format: uri
          readOnly: true
          type: string
        message:
          type: string
        status:
          type: string
      required:
        - status
        - message
      type: object
    UpdateIncidentUpdateResponseBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://api.uptimeeye.com/schemas/UpdateIncidentUpdateResponseBody.json
          format: uri
          readOnly: true
          type: string
        incidentUpdate:
          $ref: "#/components/schemas/IncidentUpdate"
      required:
        - incidentUpdate
      type: object
    UpdateStatusPageResponseBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://api.uptimeeye.com/schemas/UpdateStatusPageResponseBody.json
          format: uri
          readOnly: true
          type: string
        status_page:
          $ref: "#/components/schemas/StatusPage"
      required:
        - status_page
      type: object
    UptimeSeries:
      additionalProperties: false
      properties:
        time:
          description: unix timestamp
          example: 1672531200
          format: int64
          type: integer
        uptime:
          format: float
          type: number
      required:
        - time
        - uptime
      type: object
    UserSettings:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://api.uptimeeye.com/schemas/UserSettings.json
          format: uri
          readOnly: true
          type: string
        hasCompletedSidebarOnboarding:
          description: whether user has completed sidebar onboarding
          example: true
          type: boolean
      type: object
    Variable:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://api.uptimeeye.com/schemas/Variable.json
          format: uri
          readOnly: true
          type: string
        id:
          example: var_tXlzMyixOqgBXtD8Myc8R
          type: string
        key:
          example: API_KEY
          type: string
        secure:
          example: true
          type: boolean
        value:
          example: secret-value
          type: string
      required:
        - key
        - secure
      type: object
    WaitingListEntry:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://api.uptimeeye.com/schemas/WaitingListEntry.json
          format: uri
          readOnly: true
          type: string
        created_at:
          example: "2024-11-28T15:04:05Z"
          format: date-time
          type: string
        email:
          example: user@example.com
          type: string
        id:
          example: wl_tXlzMyixOqgBXtD8Myc8R
          type: string
        updated_at:
          example: "2024-11-28T15:04:05Z"
          format: date-time
          type: string
      required:
        - email
      type: object
    WebhookConfiguration:
      additionalProperties: false
      properties:
        webhookUrl:
          type: string
      required:
        - webhookUrl
      type: object
    WhoAmIOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://api.uptimeeye.com/schemas/WhoAmIOutputBody.json
          format: uri
          readOnly: true
          type: string
        activeSubscription:
          description: true if the organization has an active subscription
          type: boolean
        hasStripeCustomer:
          description: true if the organization has a Stripe customer (for billing history)
          type: boolean
        isFreePlan:
          description: true if the organization is on the free plan
          type: boolean
        isInTrial:
          description: true if the organization is in a trial period
          type: boolean
        organizationId:
          description: active organization id
          example: org_2gXP92jmF1kFvALmhYiCnuoP791
          type: string
        subscriptionName:
          description: name of the current subscription plan
          example: Pro
          type: string
        trialDaysRemaining:
          description: number of days remaining in trial, 0 if not in trial
          format: int64
          type: integer
        userId:
          description: user id
          example: user_2aAzBP9L6fe32FQWiy4Le92SVkF
          type: string
        user_settings:
          $ref: "#/components/schemas/UserSettings"
          description: user settings object
      required:
        - userId
        - activeSubscription
        - isFreePlan
        - isInTrial
        - trialDaysRemaining
        - hasStripeCustomer
      type: object
